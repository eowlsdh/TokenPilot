# TokenPilot pre-commit — 시크릿 스캔 + .gitignore 실효성 검증.
# 설치: pip install pre-commit && pre-commit install
# 수동 실행: pre-commit run --all-files

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: check-gitignore
        name: .gitignore 실효성 검증
        entry: Scripts/check-gitignore.sh
        language: script
        pass_filenames: false
        always_run: true
