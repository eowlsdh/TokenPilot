name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # The app's floor is macOS 26, and a deployment target above the SDK does not build.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        # Picking the newest installed Xcode instead of pinning a path: the runner image renames
        # and drops Xcode versions on its own schedule, and a stale path fails with a message that
        # says nothing about why. Fails loudly when nothing new enough is present.
        run: |
          set -euo pipefail
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$newest" ]; then
            newest=/Applications/Xcode.app
          fi
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK: $sdk"
          floor=$(sed -n 's/^ *macOS: *"\([0-9]*\).*/\1/p' project.yml | head -1)
          if [ "${sdk%%.*}" -lt "$floor" ]; then
            echo "::error::SDK $sdk is older than the project's macOS $floor floor" >&2
            exit 1
          fi

      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.45.4
        run: |
          set -euo pipefail

          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
            exit 0
          fi

          curl -fsSL \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            -o /tmp/xcodegen.zip
          rm -rf /tmp/xcodegen
          mkdir -p /tmp/xcodegen
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo install /tmp/xcodegen/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          xcodegen --version

      - name: Build
        run: swift build

      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Xcode build (unsigned)
        run: |
          xcodebuild \
            -project TokenPilot.xcodeproj \
            -scheme TokenPilot \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: App bundle smoke test
        run: |
          ./build.sh
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/TokenPilot.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/TokenPilot.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' build/TokenPilot.app/Contents/Info.plist
          test -f build/TokenPilot.app/Contents/Resources/TokenMonitor_TokenApp.bundle/Localizable.xcstrings
          test -f build/TokenPilot.app/Contents/Resources/PrivacyInfo.xcprivacy
          test -f build/TokenPilot.app/Contents/Resources/TokenPilot.icns
