name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    # 이 앱은 프로바이더 인증 파일을 읽는다. 실제 토큰이 픽스처나 산출물에 섞여
    # 공개 저장소로 나가는 것이 가장 큰 사고 경로라 빌드보다 앞에 둔다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks는 push/PR 범위를 git log로 훑는다. shallow(기본 depth=1)면
          # 베이스 커밋의 부모를 해석하지 못해 fatal로 끝난다.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history for secrets
        # .gitleaks.toml이 저장소 루트에 있으면 자동 적용된다.
        run: gitleaks git --redact --no-banner --exit-code 1

      - name: Verify .gitignore is effective
        run: Scripts/check-gitignore.sh

  build-and-test:
    needs: secret-scan
    # The app's floor is macOS 26, and a deployment target above the SDK does not build.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        # Picking the newest installed Xcode instead of pinning a path: the runner image renames
        # and drops Xcode versions on its own schedule, and a stale path fails with a message that
        # says nothing about why. Fails loudly when nothing new enough is present.
        run: |
          set -euo pipefail
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$newest" ]; then
            newest=/Applications/Xcode.app
          fi
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK: $sdk"
          floor=$(sed -n 's/^ *macOS: *"\([0-9]*\).*/\1/p' project.yml | head -1)
          if [ "${sdk%%.*}" -lt "$floor" ]; then
            echo "::error::SDK $sdk is older than the project's macOS $floor floor" >&2
            exit 1
          fi

      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.45.4
        run: |
          set -euo pipefail

          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
            exit 0
          fi

          curl -fsSL \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            -o /tmp/xcodegen.zip
          rm -rf /tmp/xcodegen
          mkdir -p /tmp/xcodegen
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo install /tmp/xcodegen/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          xcodegen --version

      - name: Build
        run: swift build

      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Xcode build (unsigned)
        run: |
          xcodebuild \
            -project TokenPilot.xcodeproj \
            -scheme TokenPilot \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: App bundle smoke test
        run: |
          ./build.sh
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/TokenPilot.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/TokenPilot.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' build/TokenPilot.app/Contents/Info.plist
          test -f build/TokenPilot.app/Contents/Resources/TokenMonitor_TokenApp.bundle/Localizable.xcstrings
          test -f build/TokenPilot.app/Contents/Resources/PrivacyInfo.xcprivacy
          test -f build/TokenPilot.app/Contents/Resources/TokenPilot.icns
